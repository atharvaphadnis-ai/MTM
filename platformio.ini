; PlatformIO configuration for MicroTask Monitor
; ============================================================
;
; Each [env:*] block defines a build target. Pick the one that
; matches your board (or add a new env derived from these).
;
; Quick start:
;   pio run -e uno        # build the AVR library + BasicMonitoring
;   pio run -e esp32      # build for ESP32
;   pio run -e pico       # build for Raspberry Pi Pico
;   pio run -e host       # build & run the host-side unit tests
;
; To upload:
;   pio run -e esp32 -t upload
;
; To open the serial monitor:
;   pio device monitor -p /dev/ttyUSB0 -b 115200
;
; License: MIT.

[platformio]
default_envs = esp32

[common]
build_flags =
    -std=c++11
    -Wall -Wextra -Wno-unused-parameter
lib_ldf_mode = deep+
lib_deps =

; ---------------------- Arduino Uno / Nano (AVR) ---------------------
[env:uno]
platform      = atmelavr
board         = uno
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- Arduino Mega 2560 (AVR) ----------------------
[env:mega]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- Arduino Leonardo (AVR) ----------------------
[env:leonardo]
platform      = atmelavr
board         = leonardo
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- ESP32 (classic) ------------------------------
[env:esp32]
platform      = espressif32
board         = esp32dev
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- ESP32-S3 -------------------------------------
[env:esp32s3]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- ESP32-C3 -------------------------------------
[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- ESP8266 (NodeMCU) ---------------------------
[env:esp8266]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- STM32 F1 (BluePill) -------------------------
[env:stm32f1]
platform      = ststm32
board         = bluepill_f103c8
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- STM32 F4 (BlackPill) ------------------------
[env:stm32f4]
platform      = ststm32
board         = blackpill_f411ce
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- Raspberry Pi Pico (RP2040) -------------------
[env:pico]
platform      = raspberrypi
board         = pico
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- Arduino Zero (SAMD21) ------------------------
[env:zero]
platform      = atmelsam
board         = zero
framework     = arduino
build_flags   = ${common.build_flags}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200

; ---------------------- Host unit tests -----------------------------
; This env compiles and runs the host-side unit tests using the
; native platformio platform.
[env:host]
platform    = native
build_flags =
    -std=c++11
    -DHOST_BUILD
    -Isrc
    -Itests
    -Itests/host
src_filter  = +<src> +<tests/MTMTests.cpp> +<tests/host/MTMTestHostPrint.h>
build_type  = release
